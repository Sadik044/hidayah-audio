<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#011914" />
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)" />

  <!-- Subtle gold glow -->
  <circle cx="200" cy="200" r="160" fill="url(#goldGlow)" />

  <!-- Decorative Islamic Geometric Diamond / Octagon Frame -->
  <rect x="60" y="60" width="280" height="280" rx="24" fill="none" stroke="#c59a3f" stroke-width="1.5" stroke-opacity="0.4" />
  <rect x="60" y="60" width="280" height="280" rx="24" transform="rotate(45 200 200)" fill="none" stroke="#c59a3f" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 4" />

  <!-- Center Circle -->
  <circle cx="200" cy="200" r="64" fill="#065f46" fill-opacity="0.6" stroke="#c59a3f" stroke-width="2" />

  <!-- Headphones / Audio Waves Icon -->
  <path d="M165 205V195C165 175.67 180.67 160 200 160C219.33 160 235 175.67 235 195V205" fill="none" stroke="#fef3c7" stroke-width="5" stroke-linecap="round" />
  <rect x="156" y="196" width="16" height="26" rx="6" fill="#f59e0b" />
  <rect x="228" y="196" width="16" height="26" rx="6" fill="#f59e0b" />
  
  <!-- Sound Waves below -->
  <line x1="185" y1="236" x2="185" y2="246" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
  <line x1="195" y1="232" x2="195" y2="250" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
  <line x1="205" y1="230" x2="205" y2="252" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
  <line x1="215" y1="236" x2="215" y2="246" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />

  <!-- Bangla Brand Text -->
  <text x="200" y="310" text-anchor="middle" fill="#fef3c7" font-family="'Hind Siliguri', sans-serif" font-size="18" font-weight="600" letter-spacing="1">হিদায়াহ অডিও</text>
  <text x="200" y="328" text-anchor="middle" fill="#c59a3f" font-family="sans-serif" font-size="10" font-weight="500" letter-spacing="2">HIDAYAH AUDIO</text>
</svg>
